name: Probe SME + news sources (temporary)
on: workflow_dispatch
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: NSE bhavcopies
        run: |
          UA='Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/128 Safari/537.36'
          get() { echo "=== $1"; curl -sS -m 40 -A "$UA" -H 'Referer: https://www.nseindia.com/' -o /tmp/f -w "status=%{http_code} size=%{size_download}\n" "$1" || true; }
          get https://nsearchives.nseindia.com/products/content/sec_bhavdata_full_06092024.csv
          head -2 /tmp/f; cut -d, -f2 /tmp/f | sort | uniq -c | sort -rn | head -12; grep -i "KRISHCA" /tmp/f | head -2
          get https://nsearchives.nseindia.com/content/cm/BhavCopy_NSE_CM_0_0_0_20240906_F_0000.csv.zip
          unzip -p /tmp/f > /tmp/u 2>/dev/null && head -2 /tmp/u && grep -i KRISHCA /tmp/u | head -2
          get https://nsearchives.nseindia.com/archives/sme/bhavcopy/sme060924.csv
          head -3 /tmp/f; grep -i KRISHCA /tmp/f | head -2
          get https://nsearchives.nseindia.com/content/historical/EQUITIES/2016/JAN/cm04JAN2016bhav.csv.zip
          unzip -p /tmp/f > /tmp/u 2>/dev/null && head -2 /tmp/u && cut -d, -f2 /tmp/u | sort | uniq -c | sort -rn | head -8
          get https://nsearchives.nseindia.com/products/content/sec_bhavdata_full_04012016.csv
          head -2 /tmp/f
          get https://nsearchives.nseindia.com/products/content/sec_bhavdata_full_02012020.csv
          head -2 /tmp/f
      - name: NSE history API with cookies
        run: |
          UA='Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/128 Safari/537.36'
          curl -sS -m 30 -A "$UA" -c /tmp/c -o /dev/null -w "home status=%{http_code}\n" https://www.nseindia.com/ || true
          for u in 'https://www.nseindia.com/api/historical/cm/equity?symbol=KRISHCA&series=%5B%22SM%22,%22ST%22%5D&from=01-01-2024&to=31-12-2024' \
                   'https://www.nseindia.com/api/historicalOR/generateSecurityWiseHistoricalData?from=01-01-2024&to=31-12-2024&symbol=KRISHCA&type=priceVolumeDeliverable&series=ALL' \
                   'https://www.nseindia.com/api/quote-equity?symbol=KRISHCA'; do
            echo "=== $u"; curl -sS -m 30 -A "$UA" -b /tmp/c -H 'Referer: https://www.nseindia.com/get-quotes/equity?symbol=KRISHCA' -H 'Accept: application/json' -o /tmp/j -w "status=%{http_code} size=%{size_download}\n" "$u" || true; head -c 400 /tmp/j; echo
          done
      - name: GDELT + Google News repeat
        run: |
          echo "=== GDELT"; curl -sS -m 40 -H 'Origin: https://arhamsaraogi-star.github.io' -D /tmp/h -o /tmp/g -w "status=%{http_code}\n" 'https://api.gdeltproject.org/api/v2/doc/doc?query=%22TD%20Power%20Systems%22&mode=ArtList&format=json&maxrecords=20&startdatetime=20240101000000&enddatetime=20240301000000' || true
          grep -i access-control /tmp/h; head -c 600 /tmp/g; echo
          echo "=== GDELT sourcecountry"; curl -sS -m 40 -o /tmp/g 'https://api.gdeltproject.org/api/v2/doc/doc?query=%22Larsen%20%26%20Toubro%22%20sourcecountry:IN&mode=ArtList&format=json&maxrecords=10&startdatetime=20200301000000&enddatetime=20200331000000' -w "status=%{http_code}\n" || true; head -c 500 /tmp/g; echo
          for i in 1 2 3 4 5 6; do curl -sS -m 20 -A 'Mozilla/5.0' -o /dev/null -w "google news #$i status=%{http_code}\n" "https://news.google.com/rss/search?q=%22Tata%20Motors%22%20after%3A2020-0$i-01%20before%3A2020-0$i-20&hl=en-IN&gl=IN&ceid=IN:en"; done
          echo "=== Bing news rss"; curl -sS -m 20 -A 'Mozilla/5.0' -o /tmp/b -w "status=%{http_code}\n" 'https://www.bing.com/news/search?q=%22TD+Power+Systems%22&format=rss'; grep -o '<title>[^<]*' /tmp/b | head -4
