name: Probe exchange announcements (temporary)
on: workflow_dispatch
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: NSE announcements
        run: |
          UA='Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/128 Safari/537.36'
          j() { echo "=== $1"; curl -sS -m 30 -A "$UA" -H 'Accept: application/json' -H "Referer: https://www.nseindia.com/companies-listing/corporate-filings-announcements" -o /tmp/j -w "status=%{http_code} size=%{size_download}\n" "$1" || true; head -c 700 /tmp/j; echo; }
          j 'https://www.nseindia.com/api/corporate-announcements?index=equities&symbol=TDPOWERSYS&from_date=01-09-2026&to_date=20-09-2026'
          j 'https://www.nseindia.com/api/corporate-announcements?index=equities&symbol=YESBANK&from_date=15-09-2018&to_date=25-09-2018'
          j 'https://www.nseindia.com/api/corporate-announcements?index=equities&symbol=INFY&from_date=14-08-2017&to_date=20-08-2017'
          j 'https://www.nseindia.com/api/corporate-announcements?index=equities&symbol=HDFCBANK&from_date=12-01-2024&to_date=18-01-2024'
          j 'https://www.nseindia.com/api/corporate-announcements?index=sme&symbol=KRISHCA&from_date=01-01-2024&to_date=31-12-2024'
          j 'https://www.nseindia.com/api/corporate-board-meetings?index=equities&symbol=HDFCBANK&from_date=01-01-2024&to_date=31-01-2024'
          j 'https://www.nseindia.com/api/corporates-pit?index=equities&symbol=TDPOWERSYS&from_date=01-08-2026&to_date=20-09-2026'
      - name: BSE announcements
        run: |
          UA='Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/128 Safari/537.36'
          for u in 'https://api.bseindia.com/BseIndiaAPI/api/AnnSubCategoryGetData/w?pageno=1&strCat=-1&strPrevDate=20240112&strScrip=500180&strSearch=P&strToDate=20240118&strType=C&subcategory=-1' \
                   'https://api.bseindia.com/BseIndiaAPI/api/AnnGetData/w?strCat=-1&strPrevDate=20240112&strScrip=500180&strSearch=P&strToDate=20240118&strType=C'; do
            echo "=== $u"; curl -sS -m 30 -A "$UA" -H 'Referer: https://www.bseindia.com/' -H 'Origin: https://www.bseindia.com' -H 'Accept: application/json' -o /tmp/b -w "status=%{http_code} size=%{size_download}\n" "$u" || true; head -c 600 /tmp/b; echo
          done
