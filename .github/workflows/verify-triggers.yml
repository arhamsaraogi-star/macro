name: Verify triggers on known events

on:
  workflow_dispatch:
    inputs:
      cases:
        description: "Comma-separated symbols to check (empty = all)"
        required: false
  push:
    paths: ["site/js/**", "scripts/verify-triggers.mjs", ".github/workflows/verify-triggers.yml"]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Start the repo's relay code locally (so unreleased relay changes are tested too)
        working-directory: relay
        run: |
          npx --yes wrangler@3 dev --port 8787 --ip 127.0.0.1 > /tmp/wrangler.log 2>&1 &
          for i in $(seq 1 60); do curl -s http://127.0.0.1:8787/ >/dev/null && break; sleep 2; done
          curl -s http://127.0.0.1:8787/; echo
      - run: node scripts/verify-triggers.mjs
        env:
          CASES: ${{ github.event.inputs.cases }}
          RELAY: http://127.0.0.1:8787
