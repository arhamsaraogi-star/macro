name: Verify triggers on known events

on:
  workflow_dispatch:
    inputs:
      cases:
        description: "Comma-separated symbols to check (empty = all)"
        required: false
  push:
    paths: ["site/js/**", "scripts/verify-triggers.mjs", ".github/workflows/verify-triggers.yml"]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Start the local server (npm start), exactly as on a laptop
        run: |
          npm i --no-save linkedom >/dev/null 2>&1
          nohup npm start > /tmp/serve.log 2>&1 &
          for i in $(seq 1 30); do curl -s http://127.0.0.1:8000/relay/ && break; sleep 1; done; echo
      - run: node scripts/verify-triggers.mjs
        env:
          CASES: ${{ github.event.inputs.cases }}
          RELAY: http://127.0.0.1:8000/relay
          LOCAL: "1"
