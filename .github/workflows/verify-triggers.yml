name: Verify triggers on known events

on:
  workflow_dispatch:
    inputs:
      cases:
        description: "Comma-separated symbols to check (empty = all)"
        required: false
  push:
    paths: ["site/js/**", "scripts/verify-triggers.mjs", ".github/workflows/verify-triggers.yml"]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/verify-triggers.mjs
        env:
          CASES: ${{ github.event.inputs.cases }}
