name: Relay end-to-end test

# Runs relay/worker.js locally (wrangler dev) and fetches real Yahoo Finance and
# Google News data through it, the same way the website does.
on:
  workflow_dispatch:
  push:
    paths: ["relay/**", ".github/workflows/relay-test.yml"]

jobs:
  relay:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Start relay
        working-directory: relay
        run: |
          npx --yes wrangler@3 dev --port 8787 --ip 127.0.0.1 > /tmp/wrangler.log 2>&1 &
          for i in $(seq 1 60); do curl -s http://127.0.0.1:8787/ >/dev/null && break; sleep 2; done
          curl -s http://127.0.0.1:8787/; echo
      - name: Fetch through relay
        run: |
          set -e
          R=http://127.0.0.1:8787/?url=
          enc() { node -e 'console.log(encodeURIComponent(process.argv[1]))' "$1"; }
          check() {
            echo "=== $1"
            code=$(curl -sS -m 40 -H 'Origin: https://arhamsaraogi-star.github.io' -D /tmp/h -o /tmp/b -w '%{http_code}' "$R$(enc "$1")")
            echo "status=$code size=$(wc -c < /tmp/b)"; grep -i '^access-control-allow-origin' /tmp/h; head -c 300 /tmp/b; echo
            test "$code" = 200
          }
          NOW=$(date +%s)
          check "https://query1.finance.yahoo.com/v8/finance/chart/TDPOWERSYS.NS?period1=0&period2=$NOW&interval=1d&events=div%2Csplit&includeAdjustedClose=true"
          node -e 'const b=require("fs").readFileSync("/tmp/b","utf8");const r=JSON.parse(b).chart.result[0];console.log("bars:",r.timestamp.length,"first:",new Date(r.timestamp[0]*1000).toISOString().slice(0,10))'
          check "https://query1.finance.yahoo.com/v8/finance/chart/KRISHCA-SM.NS?period1=0&period2=$NOW&interval=1d"
          check "https://query1.finance.yahoo.com/v8/finance/chart/%5ECNXINFRA?period1=0&period2=$NOW&interval=1d"
          check "https://query1.finance.yahoo.com/v8/finance/chart/BZ%3DF?period1=0&period2=$NOW&interval=1d"
          check "https://query1.finance.yahoo.com/v1/finance/search?q=td%20power&quotesCount=10&newsCount=0&listsCount=0&enableFuzzyQuery=true"
          check "https://news.google.com/rss/search?q=%22TD%20Power%20Systems%22%20after%3A2024-01-01%20before%3A2024-02-15&hl=en-IN&gl=IN&ceid=IN:en"
          grep -o '<title>[^<]*</title>' /tmp/b | head -5
          echo "=== blocked host check"; curl -s -o /dev/null -w '%{http_code}\n' "${R}https%3A%2F%2Fexample.com%2F"
      - name: Sector index / factor symbols
        run: |
          R=http://127.0.0.1:8787/?url=
          NOW=$(date +%s)
          for s in 'TDPOWERSYS.BO' '533553.BO' 'RELIANCE.BO' '500325.BO' '^NSEI' '^BSESN' '^NSEBANK' '^CNXIT' '^CNXPHARMA' '^NSEMDCP50' 'AARTIIND.NS' 'ABB.NS' 'ABFRL.NS' 'ACC.NS' 'ADANIPORTS.NS' 'AMBER.NS' 'AMBUJACEM.NS' 'ANGELONE.NS' 'APOLLOHOSP.NS' 'APOLLOTYRE.NS' 'APTECHT.NS' 'ARE&M.NS' 'ARVIND.NS' 'ASIANPAINT.NS' 'BAJAJ-AUTO.NS' 'BAJFINANCE.NS' 'BALKRISIND.NS' 'BALRAMCHIN.NS' 'BANDHANBNK.NS' 'BDL.NS' 'BEL.NS' 'BEML.NS' 'BERGEPAINT.NS' 'BHARATFORG.NS' 'BHARTIARTL.NS' 'BHEL.NS' 'BLUEDART.NS' 'BLUESTARCO.NS' 'BOSCHLTD.NS' 'BPCL.NS' 'BRITANNIA.NS' 'BSE.NS' 'CDSL.NS' 'CEATLTD.NS' 'CHALET.NS' 'CHAMBLFERT.NS' 'CHOLAFIN.NS' 'COALINDIA.NS' 'CONCOR.NS' 'COROMANDEL.NS' 'CREDITACC.NS' 'CROMPTON.NS' 'CUMMINSIND.NS' 'DABUR.NS' 'DALBHARAT.NS' 'DEEPAKNTR.NS' 'DEVYANI.NS' 'DHAMPURSUG.NS' 'DIXON.NS' 'DLF.NS' 'DMART.NS' 'EICHERMOT.NS' 'EIDPARRY.NS' 'EIHOTEL.NS' 'ENDURANCE.NS' 'EXIDEIND.NS' 'FORTIS.NS' 'GAIL.NS' 'GESHIP.NS' 'GMRAIRPORT.NS' 'GODREJPROP.NS' 'GSFC.NS' 'GUJGASLTD.NS' 'HAL.NS' 'HAVELLS.NS' 'HBLENGINE.NS' 'HDFCAMC.NS' 'HDFCLIFE.NS' 'HEROMOTOCO.NS' 'HINDALCO.NS' 'HINDCOPPER.NS' 'HINDPETRO.NS' 'HINDUNILVR.NS' 'HINDZINC.NS' 'ICICIGI.NS' 'ICICIPRULI.NS' 'IDEA.NS' 'IGL.NS' 'INDHOTEL.NS' 'INDIAMART.NS' 'INDIGO.NS' 'INDIGOPNTS.NS' 'INDUSTOWER.NS' 'INOXWIND.NS' 'IOC.NS' 'IRCON.NS' 'IRCTC.NS' 'ITC.NS' 'JINDALSTEL.NS' 'JKTYRE.NS' 'JSWENERGY.NS' 'JSWSTEEL.NS' 'JUBLFOOD.NS' 'JUSTDIAL.NS' 'KALPATPOWR.NS' 'KALYANKJIL.NS' 'KANSAINER.NS' 'KAYNES.NS' 'KEC.NS' 'KPRMILL.NS' 'LALPATHLAB.NS' 'LEMONTREE.NS' 'LICHSGFIN.NS' 'LT.NS' 'M&M.NS' 'M&MFIN.NS' 'MANAPPURAM.NS' 'MARUTI.NS' 'MAXHEALTH.NS' 'MAZDOCK.NS' 'MCX.NS' 'METROPOLIS.NS' 'MGL.NS' 'MOTHERSON.NS' 'MRF.NS' 'MRPL.NS' 'NATIONALUM.NS' 'NAUKRI.NS' 'NAVINFLUOR.NS' 'NCC.NS' 'NESTLEIND.NS' 'NETWORK18.NS' 'NH.NS' 'NHPC.NS' 'NIITLTD.NS' 'NLCINDIA.NS' 'NMDC.NS' 'NTPC.NS' 'OBEROIRLTY.NS' 'OIL.NS' 'ONGC.NS' 'PAGEIND.NS' 'PAYTM.NS' 'PETRONET.NS' 'PHOENIXLTD.NS' 'PIDILITIND.NS' 'PNCINFRA.NS' 'POLICYBZR.NS' 'POWERGRID.NS' 'PRESTIGE.NS' 'PVRINOX.NS' 'RAJESHEXPO.NS' 'RCF.NS' 'RELIANCE.NS' 'RENUKA.NS' 'RVNL.NS' 'SAIL.NS' 'SAPPHIRE.NS' 'SBILIFE.NS' 'SCI.NS' 'SENCO.NS' 'SHOPERSTOP.NS' 'SHREECEM.NS' 'SHRIRAMFIN.NS' 'SIEMENS.NS' 'SPANDANA.NS' 'SRF.NS' 'SUNTV.NS' 'SUZLON.NS' 'SYRMA.NS' 'TATACOMM.NS' 'TATAPOWER.NS' 'TATASTEEL.NS' 'TEXRAIL.NS' 'THERMAX.NS' 'THYROCARE.NS' 'TITAGARH.NS' 'TITAN.NS' 'TORNTPOWER.NS' 'TRENT.NS' 'TRIDENT.NS' 'TRIVENI.NS' 'ULTRACEMCO.NS' 'UPL.NS' 'VEDL.NS' 'VMART.NS' 'VOLTAS.NS' 'WELSPUNLIV.NS' 'WESTLIFE.NS' 'WHIRLPOOL.NS' 'ZEEL.NS'; do
            e=$(node -e 'console.log(encodeURIComponent(`https://query1.finance.yahoo.com/v8/finance/chart/${encodeURIComponent(process.argv[1])}?period1=0&period2=${process.argv[2]}&interval=1d`))' "$s" "$NOW")
            n=$(curl -s -m 30 "$R$e" | node -e 'let d="";process.stdin.on("data",c=>d+=c).on("end",()=>{try{const r=JSON.parse(d).chart.result;if(!r){console.log("none");return}const t=r[0].timestamp||[];const gaps=t.slice(1).map((x,i)=>(x-t[i])/86400).sort((a,b)=>a-b);const iso=x=>new Date(x*1000).toISOString().slice(0,10);console.log(`${t.length} bars ${t.length?iso(t[0]):""}..${t.length?iso(t.at(-1)):""} medianGapDays=${gaps.length?gaps[gaps>>1]??gaps[Math.floor(gaps.length/2)]:"-"}`)}catch(e){console.log("err",e.message)}})')
            echo "$s -> $n"
          done
      - name: Ticker list build
        run: node scripts/build-tickers.mjs && node -e 'const d=require("./site/data/tickers.json");console.log(d.rows.length, d.rows.filter(r=>/TD POWER/i.test(r.n)))'
      - if: always()
        run: tail -30 /tmp/wrangler.log
