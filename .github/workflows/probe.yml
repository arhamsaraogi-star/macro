name: Probe data sources (temporary)
on: workflow_dispatch
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe
        run: |
          Y='https://query1.finance.yahoo.com/v8/finance/chart/TDPOWERSYS.NS?range=5d&interval=1d'
          S='https://query1.finance.yahoo.com/v1/finance/search?q=td%20power&quotesCount=5&newsCount=0'
          N='https://news.google.com/rss/search?q=TD%20Power&hl=en-IN&gl=IN&ceid=IN:en'
          ORIGIN='https://arhamsaraogi-star.github.io'
          enc() { python3 -c "import urllib.parse,sys;print(urllib.parse.quote(sys.argv[1],safe=''))" "$1"; }
          probe() { echo "=== $1"; curl -sS -m 25 -H "Origin: $ORIGIN" -D /tmp/h -o /tmp/b -w "status=%{http_code} time=%{time_total}\n" "$1" || true; grep -i "access-control-allow-origin" /tmp/h || echo "(no ACAO)"; head -c 200 /tmp/b; echo; }
          for u in "$Y" "$S" "https://query2.finance.yahoo.com/v8/finance/chart/TDPOWERSYS.NS?range=5d&interval=1d" "$N"; do probe "$u"; done
          for u in "$Y" "$N"; do
            e=$(enc "$u")
            probe "https://api.allorigins.win/raw?url=$e"
            probe "https://api.allorigins.win/get?url=$e"
            probe "https://api.codetabs.com/v1/proxy/?quest=$e"
            probe "https://api.cors.lol/?url=$e"
            probe "https://cors.eu.org/$u"
            probe "https://everyorigin.jwvbremen.nl/api/get?url=$e"
            probe "https://whateverorigin.org/get?url=$e"
            probe "https://thingproxy.freeboard.io/fetch/$u"
            probe "https://proxy.corsfix.com/?$u"
            probe "https://cors-anywhere.com/$u"
            probe "https://corsproxy.io/?url=$e"
          done
      - name: Ticker lists
        run: |
          UA='Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126 Safari/537.36'
          for u in https://nsearchives.nseindia.com/content/equities/EQUITY_L.csv https://nsearchives.nseindia.com/emerge/corporates/content/SME_EQUITY_L.csv https://archives.nseindia.com/content/equities/EQUITY_L.csv; do
            echo "=== $u"; curl -sS -m 30 -A "$UA" -o /tmp/l -w "status=%{http_code}\n" "$u" || true; wc -l /tmp/l; head -3 /tmp/l; grep -i "TDPOWER" /tmp/l || true
          done
          B='https://api.bseindia.com/BseIndiaAPI/api/ListofScripData/w?Group=&Scripcode=&industry=&segment=Equity&status=Active'
          echo "=== BSE"; curl -sS -m 40 -A "$UA" -H 'Referer: https://www.bseindia.com/' -H 'Origin: https://www.bseindia.com' -o /tmp/bse -w "status=%{http_code}\n" "$B" || true
          head -c 600 /tmp/bse; echo; python3 -c "import json;d=json.load(open('/tmp/bse'));print(len(d));print([x for x in d if 'TD POWER' in (x.get('Issuer_Name') or '').upper()][:2])" || true
          B2='https://api.bseindia.com/BseIndiaAPI/api/ListofScripData/w?Group=&Scripcode=&industry=&segment=SME&status=Active'
          echo "=== BSE SME"; curl -sS -m 40 -A "$UA" -H 'Referer: https://www.bseindia.com/' -o /tmp/bses -w "status=%{http_code}\n" "$B2" || true
          head -c 400 /tmp/bses; echo; python3 -c "import json;d=json.load(open('/tmp/bses'));print(len(d))" || true
      - name: Yahoo symbol format for SME
        run: |
          for s in KRISHCA.NS KRISHCA-SM.NS KRISHCA-ST.NS 543599.BO; do
            echo "== $s"; curl -sS -m 20 -A 'Mozilla/5.0' "https://query1.finance.yahoo.com/v8/finance/chart/$s?range=5d&interval=1d" | head -c 250; echo
          done
          curl -sS -m 20 -A 'Mozilla/5.0' "https://query1.finance.yahoo.com/v1/finance/search?q=krishca&quotesCount=10&newsCount=0" | head -c 800; echo
